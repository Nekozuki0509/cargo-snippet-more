[workspace]
members = ["cargo-snippet-more", "cargo-snippet-more-macros"]
resolver = "2"

[workspace.package]
version = "0.2.2"
authors = ["Nekozuki0509"]
repository = "https://github.com/Nekozuki0509/cargo-snippet-more.git"
license = "MIT"
edition = "2024"

[workspace.dependencies]
cargo-snippet-more-macros = { version = "0.2.2", path = "cargo-snippet-more-macros" }
syn = { version = "1", features = ["full", "parsing", "extra-traits", "printing", "visit", "visit-mut"] }
quote = "1"
proc-macro2 = "1"
rustfmt-nightly = "1"
glob = "0.3"
clap = "2.29"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
log = "0.4"
env_logger = "0.7"
regex = "1.3.5"
lazy_static = "1.4.0"
toml = "0.9.6"
anyhow = "1.0.100"
cargo_metadata = "0.23.1"
